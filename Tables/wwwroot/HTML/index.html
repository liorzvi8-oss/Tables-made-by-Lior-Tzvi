<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Homepage</title>
    <style>
        .main-table {
            width: 85%;
            margin: 20px auto;
            border-collapse: collapse;
        }

            .main-table th, .main-table td {
                border: 1px solid #7f7f7f;
                padding: 10px;
                text-align: center;
                vertical-align: middle;
            }

        .welcome-title {
            font-size: 32px;
            padding: 40px;
        }

        .card {
            width: 100%;
            display: inline-block;
            border: 1px solid #7f7f7f;
            position: relative;
            overflow: hidden;
        }

            .card img {
                width: 100%;
                height: auto;
                display: block;
            }

        .title {
            font-weight: bold;
            font-size: 14px;
            background-color: #555555;
            color: white;
            padding: 6px 0;
            font-family: 'Century Gothic', sans-serif;
            opacity: 0.7;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <table class="main-table" border="1">
        <tr>

        </tr>
